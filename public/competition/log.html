<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Log</title>
    <link rel="manifest" href="/manifest.json" />
    <link href="/css/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans antialiased">
    <div class="relative flex min-h-screen flex-col overflow-hidden py-6 sm:py-12">
        <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
            <!-- Header -->
            <header class="mb-8">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <svg class="h-10 w-10 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                        </svg>
                        <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white ml-3">Competition Log</h1>
                    </div>
                    <a href="/" class="inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        <svg class="h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                        </svg>
                        Back to Dashboard
                    </a>
                </div>
                <p class="mt-2 text-gray-600 dark:text-gray-400">All starts, resets, splits and ignored splits of the current session. Refreshes automatically every 10 seconds.</p>
            </header>

            <!-- Log Viewer -->
            <main>
                <div class="flex justify-end gap-4 mb-6">
                    <button id="refresh-btn" aria-label="Refresh Log"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg px-6 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 dark:focus:ring-offset-gray-900">
                        Refresh Log
                    </button>
                    <a id="download-btn" href="/logs/competition.log?download=1" download aria-label="Download Log"
                        class="inline-flex items-center gap-2 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded-lg px-6 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 dark:focus:ring-offset-gray-900">
                        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                        </svg>
                        Download Log
                    </a>
                </div>
                <div class="card rounded-lg shadow-lg overflow-hidden">
                    <div class="bg-gray-200 dark:bg-gray-700 p-2 flex items-center">
                        <div class="flex-1 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 pr-10">
                            competition.log
                        </div>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6">
                        <pre id="log-content"
                            class="text-sm text-gray-900 dark:text-gray-200 whitespace-pre-wrap break-words">Loading log...</pre>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="bg-gray-800 text-white p-4 text-center mt-8">
        <p>&copy; Patrick Development 2025</p>
    </footer>

    <script>
        async function fetchLog() {
            const logContent = document.getElementById('log-content');
            try {
                const res = await fetch('/logs/competition.log', { cache: 'no-store' });
                if (!res.ok) throw new Error(`Could not load log file (status: ${res.status})`);
                const text = await res.text();
                logContent.textContent = text.trim() || 'Log file is empty.';
            } catch (e) {
                logContent.textContent = `Error loading log: ${e.message}`;
            }
        }
        document.getElementById('refresh-btn').addEventListener('click', fetchLog);
        window.addEventListener('DOMContentLoaded', fetchLog);
        // Auto-refresh every 10 seconds
        setInterval(fetchLog, 10000);
    </script>
</body>

</html>
